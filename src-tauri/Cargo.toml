[package]
name = "sfxroot"
version = "0.1.0"
description = "SFX Root - Sound Effects Library Manager"
authors = ["you"]
edition = "2021"

[lib]
name = "sfxroot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "time"] }

# File operations
walkdir = "2"

# Parallel processing
rayon = "1"

# Audio metadata - Pure Rust, no FFmpeg
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "ogg", "wav", "aiff", "isomp4"] }
lofty = "0.21"

# Error handling
thiserror = "1"

# Concurrency
parking_lot = "0.12"

# Testing
[dev-dependencies]
tempfile = "3"
